name: Test

# pytest 를 GitHub Actions 에서 실행한다 (린트는 code-style.yml 이 담당).
#   - tests/conftest.py 의 db_session 류 픽스처는 DB 에 붙을 수 없거나 마이그레이션 head 가 아니면 건너뛴다.
#     저장소 SQL 스모크 테스트까지 돌리기 위해 PostgreSQL 17 서비스 컨테이너를 띄우고 alembic upgrade head 를 먼저 적용한다.
#   - 엔진 대조 시험은 GLOWSHIP_ENGINE_DIR 이 없으면 건너뛴다. 엔진 코드는 저장소에 없으므로 CI 는 엔진 없이 돈다
#     (docs/analysis/engine-local-path.md).
#   - 설정(app/core/config.py)은 .env 가 없으면 환경변수에서 읽는다. 저장소에는 .env 가 없으므로 아래 env 로 넣는다.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: glowship
  POSTGRES_PASSWORD: glowship
  POSTGRES_DB: glowship

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        # docker-compose.yml 과 같은 이미지. 컨테이너의 POSTGRES_USER 는 superuser 라 0001 의 CREATE ROLE 이 가능하다.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glowship -d glowship"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 앱·alembic 이 읽는 설정 (.env.example 과 같은 키). 서비스 컨테이너는 runner 의 localhost 로 포트가 열린다.
      APP_ENV: local
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # HS256 키는 32자 이상이어야 기동한다 (Settings.jwt_secret_key). CI 전용 더미 값이며 운영 키가 아니다.
      JWT_SECRET_KEY: ci-only-dummy-jwt-secret-key-not-for-production-0000
      # 출처 검사 시험(tests/modules/user/test_auth_logout_api.py)이 허용 오리진 첫 항목을 읽으므로 비워 두면 실패한다.
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost:8000"]'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies
        # .python-version(3.14) 의 Python 을 uv 가 설치하고, uv.lock 그대로(--frozen) dev 그룹까지 설치한다.
        run: uv sync --frozen

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run pytest
        run: uv run pytest -q
